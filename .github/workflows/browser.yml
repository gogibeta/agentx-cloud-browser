name: cloud-browser

# AgentX cloud browser PoC (EXPERIMENTAL).
# Runs headless Chromium on the GitHub-hosted runner, exposes it via an ngrok
# tunnel (free tier), and registers the tunnel URL with the Cloudflare Worker
# so clients always use ONE stable Worker URL.
#
# NOTE: cloudflared quick tunnels were tried first but their edge 403-blocks
# every datacenter IP — including Cloudflare Workers themselves — so the
# Worker could never reach the tunnel. localhost.run was tried next but never
# prints the assigned tunnel URL without an interactive terminal, so the
# runner could not discover it. ngrok's local API reports the public URL as
# JSON, which is reliable.
#
# Restarts are SELF-CHAINED: each run dispatches its own successor via the
# GitHub API at ~4h50m, well before the 6h job kill. No reliance on GitHub's
# scheduled cron. A separate watchdog re-dispatches if the chain ever breaks.

on:
  workflow_dispatch:

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 355 # hard kill stays under GitHub's 6h job limit
    permissions:
      contents: write # heartbeat commit
      actions: write  # self-dispatch of the successor run
    # NOTE: no `concurrency` group on purpose — overlapping runs are required.

    steps:
      - uses: actions/checkout@v4

      - name: Heartbeat (keeps the repo active)
        run: |
          git config user.name "agentx-bot"
          git config user.email "agentx-bot@users.noreply.github.com"
          date -u +%FT%TZ > .heartbeat
          git add .heartbeat
          git commit -m "heartbeat $(date -u +%FT%TZ)" >/dev/null 2>&1 || true
          git push >/dev/null 2>&1 || true

      - name: Install ngrok
        run: |
          curl -fsSL -o /tmp/ngrok.tgz \
            https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-linux-amd64.tgz
          tar -xzf /tmp/ngrok.tgz -C /tmp
          chmod +x /tmp/ngrok
          /tmp/ngrok version

      - name: Start Chromium (headless, CDP on 127.0.0.1:9222)
        run: |
          CHROME=$(which google-chrome || which chromium-browser || which chromium)
          echo "Using: $CHROME"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --remote-debugging-address=127.0.0.1 --remote-debugging-port=9222 \
            --user-data-dir=/tmp/chrome-profile about:blank >/tmp/chrome.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:9222/json/version >/dev/null; then
              echo "CDP is up"
              break
            fi
            sleep 2
          done
          curl -sf http://127.0.0.1:9222/json/version | head -c 300; echo

      - name: Start ngrok tunnel and register with Worker
        # ngrok's local API (127.0.0.1:4040) reports the public URL as JSON —
        # no log scraping needed. The URL is self-verified against our
        # Chromium before registering.
        run: |
          /tmp/ngrok config add-authtoken "$NGROK_AUTHTOKEN" >/dev/null 2>&1
          /tmp/ngrok http 127.0.0.1:9222 --log=stdout >/tmp/ngrok.log 2>&1 &
          TUNNEL_URL=""
          for i in $(seq 1 60); do
            TUNNEL_URL=$(curl -sf -m 5 http://127.0.0.1:4040/api/tunnels 2>/dev/null | python3 -c "
          import json,sys
          try:
              ts = json.load(sys.stdin).get('tunnels', [])
              urls = [t['public_url'] for t in ts if t.get('proto') == 'https']
              print(urls[0] if urls else '')
          except Exception:
              print('')
          " 2>/dev/null)
            [ -n "$TUNNEL_URL" ] && break
            sleep 5
          done
          if [ -z "$TUNNEL_URL" ]; then
            echo "ngrok failed to start:"; tail -30 /tmp/ngrok.log; exit 1
          fi
          echo "::add-mask::$TUNNEL_URL"
          echo "ngrok tunnel is up (URL masked in logs)"
          for i in $(seq 1 12); do
            if curl -sf -m 10 "$TUNNEL_URL/json/version" 2>/dev/null | grep -q '"Browser"'; then
              echo "tunnel verified serving Chromium"; break
            fi
            if [ "$i" -eq 12 ]; then echo "tunnel URL does not serve CDP"; exit 1; fi
            sleep 5
          done
          curl -sf -X POST "$WORKER_URL/register" \
            -H "Authorization: Bearer $RELAY_SECRET" \
            -H "Content-Type: application/json" \
            -d "{\"url\":\"$TUNNEL_URL\"}"
          echo "Registered with Worker"
          echo "$TUNNEL_URL" > /tmp/tunnel_url
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          RELAY_SECRET: ${{ secrets.RELAY_SECRET }}
          NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}

      - name: Chain successor run and hold until timeout
        run: |
          TUNNEL_URL=$(cat /tmp/tunnel_url)
          dispatch_next() {
            if curl -sf -X POST \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/browser.yml/dispatches" \
              -d '{"ref":"${{ github.ref_name }}"}'; then
              echo "successor dispatched"
            else
              echo "successor dispatch FAILED"
            fi
          }
          # Dispatch the next run at ~4h50m so it is serving before this
          # job is killed at ~5h55m (~1h overlap, zero downtime).
          # NOTE: dispatches always run the workflow file as it exists on the
          # branch AT DISPATCH TIME, so successors self-heal to the newest code.
          ( sleep 17400; dispatch_next ) &
          for i in $(seq 1 70); do
            sleep 300
            if ! curl -sf -m 20 "$TUNNEL_URL/json/version" >/dev/null; then
              echo "Tunnel lost, dispatching successor now and exiting"
              dispatch_next
              exit 0
            fi
          done
          echo "Hold complete, job will now exit before the 6h limit"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
